<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.0, "parents": "seed", "role": "Seed", "components": {"current_candidate": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int n;\n    if (!(cin >> n)) return 0;\n    vector<int> minx(n), miny(n);\n    int max_width = 0;\n    int cur_y = 0;\n    vector<int> heights(n);\n    for (int i = 0; i < n; ++i) {\n        int k; cin >> k;\n        int mnx=INT_MAX, mxx=INT_MIN, mny=INT_MAX, mxy=INT_MIN;\n        for (int j = 0; j < k; ++j) {\n            int x, y; cin >> x >> y;\n            mnx=min(mnx,x); mxx=max(mxx,x);\n            mny=min(mny,y); mxy=max(mxy,y);\n        }\n        minx[i]=mnx; miny[i]=mny;\n        int w=mxx-mnx+1, h=mxy-mny+1;\n        heights[i]=h;\n        max_width=max(max_width,w);\n        cur_y+=h;\n    }\n    cout << max_width << \" \" << cur_y << \"\n\";\n    int y=0;\n    for (int i = 0; i < n; ++i) {\n        cout << -minx[i] << \" \" << y-miny[i] << \" 0 0\n\";\n        y+=heights[i];\n    }\n    return 0;\n}"}},
{"idx": 1, "score": 25.8972, "parents": "0", "role": "", "components": {"current_candidate": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int n;\n    if (!(cin >> n)) return 0;\n    vector<int> minx(n), miny(n);\n    int max_width = 0;\n    int cur_y = 0;\n    vector<int> heights(n);\n    for (int i = 0; i < n; ++i) {\n        int k; cin >> k;\n        int mnx=INT_MAX, mxx=INT_MIN, mny=INT_MAX, mxy=INT_MIN;\n        for (int j = 0; j < k; ++j) {\n            int x, y; cin >> x >> y;\n            mnx=min(mnx,x); mxx=max(mxx,x);\n            mny=min(mny,y); mxy=max(mxy,y);\n        }\n        minx[i]=mnx; miny[i]=mny;\n        int w=mxx-mnx+1, h=mxy-mny+1;\n        heights[i]=h;\n        max_width=max(max_width,w);\n        cur_y+=h;\n    }\n    cout << max_width << \" \" << cur_y << \"\\n\";\n    int y=0;\n    for (int i = 0; i < n; ++i) {\n        cout << -minx[i] << \" \" << y-miny[i] << \" 0 0\\n\";\n        y+=heights[i];\n    }\n    return 0;\n}"}},
{"idx": 2, "score": 27.8105, "parents": "1", "role": "Best", "components": {"current_candidate": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int n;\n    if (!(cin >> n)) return 0;\n    \n    vector<vector<pair<int,int>>> shapes(n);\n    vector<int> sizes(n);\n    vector<int> minx(n), miny(n), maxx(n), maxy(n);\n    \n    for (int i = 0; i < n; ++i) {\n        int k; cin >> k;\n        sizes[i] = k;\n        shapes[i].resize(k);\n        int mnx=INT_MAX, mxx=INT_MIN, mny=INT_MAX, mxy=INT_MIN;\n        for (int j = 0; j < k; ++j) {\n            int x, y; cin >> x >> y;\n            shapes[i][j] = {x, y};\n            mnx=min(mnx,x); mxx=max(mxx,x);\n            mny=min(mny,y); mxy=max(mxy,y);\n        }\n        minx[i]=mnx; miny[i]=mny;\n        maxx[i]=mxx; maxy[i]=mxy;\n    }\n    \n    // Generate all 8 transformations for each shape\n    vector<vector<vector<pair<int,int>>>> all_transforms(n);\n    for (int i = 0; i < n; ++i) {\n        vector<vector<pair<int,int>>> transforms;\n        // 4 rotations without reflection\n        vector<pair<int,int>> shape = shapes[i];\n        for (int rot = 0; rot < 4; ++rot) {\n            vector<pair<int,int>> rotated(shape.size());\n            for (int j = 0; j < shape.size(); ++j) {\n                int x = shape[j].first, y = shape[j].second;\n                if (rot == 0) rotated[j] = {x, y};\n                else if (rot == 1) rotated[j] = {y, -x};\n                else if (rot == 2) rotated[j] = {-x, -y};\n                else rotated[j] = {-y, x};\n            }\n            transforms.push_back(rotated);\n            shape = rotated;\n        }\n        \n        // 4 rotations with reflection\n        shape = shapes[i];\n        for (int rot = 0; rot < 4; ++rot) {\n            vector<pair<int,int>> reflected(shape.size());\n            for (int j = 0; j < shape.size(); ++j) {\n                int x = shape[j].first, y = shape[j].second;\n                if (rot == 0) reflected[j] = {-x, y};\n                else if (rot == 1) reflected[j] = {y, x};\n                else if (rot == 2) reflected[j] = {x, -y};\n                else reflected[j] = {-y, -x};\n            }\n            transforms.push_back(reflected);\n            shape = reflected;\n        }\n        \n        all_transforms[i] = transforms;\n    }\n    \n    // Try placing shapes in a row with different rotations/reflections\n    vector<pair<int,int>> placements(n);\n    int max_width = 0;\n    int total_height = 0;\n    vector<int> heights(n);\n    \n    for (int i = 0; i < n; ++i) {\n        int w = maxx[i] - minx[i] + 1;\n        int h = maxy[i] - miny[i] + 1;\n        max_width = max(max_width, w);\n        heights[i] = h;\n        total_height += h;\n    }\n    \n    // Try to pack in a grid-like arrangement\n    int grid_width = max_width;\n    int grid_height = total_height;\n    int best_area = grid_width * grid_height;\n    int best_w = grid_width, best_h = grid_height;\n    \n    vector<tuple<int,int,int,int>> best_placements(n); // x, y, rot, flip\n    \n    // Simple greedy approach: place each shape in order\n    vector<bool> used(n, false);\n    int cur_x = 0, cur_y = 0;\n    vector<tuple<int,int,int,int>> current_placement(n);\n    \n    vector<pair<int,int>> pos;\n    vector<vector<bool>> grid(20000, vector<bool>(20000, false)); // large enough\n    \n    auto check_and_place = [&](int idx, int x, int y, int rot, int flip) -> bool {\n        auto& shape = all_transforms[idx][rot + (flip ? 4 : 0)];\n        for (auto& p : shape) {\n            int px = x + p.first;\n            int py = y + p.second;\n            if (px < 0 || py < 0 || px >= 20000 || py >= 20000) return false;\n            if (grid[py][px]) return false;\n        }\n        for (auto& p : shape) {\n            int px = x + p.first;\n            int py = y + p.second;\n            grid[py][px] = true;\n        }\n        return true;\n    };\n    \n    auto clear_grid = [&]() {\n        for (int i = 0; i < 20000; ++i)\n            for (int j = 0; j < 20000; ++j)\n                grid[i][j] = false;\n    };\n    \n    // Try different arrangement strategies\n    int best_w2 = 1000000, best_h2 = 1000000;\n    vector<tuple<int,int,int,int>> best_placement2(n);\n    \n    // Strategy 1: place in a row (as before, but with transformations)\n    int x = 0, y = 0;\n    int max_h = 0;\n    int total_cells = 0;\n    \n    clear_grid();\n    vector<tuple<int,int,int,int>> current_placement2(n);\n    vector<int> temp_heights(n);\n    \n    vector<pair<int,int>> shape_sizes(n);\n    for (int i = 0; i < n; ++i) {\n        int w = maxx[i] - minx[i] + 1;\n        int h = maxy[i] - miny[i] + 1;\n        shape_sizes[i] = {w, h};\n    }\n    \n    // Try placing shapes one by one in a row, but with rotation/reflection\n    vector<int> indices(n);\n    iota(indices.begin(), indices.end(), 0);\n    random_shuffle(indices.begin(), indices.end());\n    \n    vector<int> x_pos(n), y_pos(n);\n    vector<int> rot(n), flip(n);\n    \n    // Simple row arrangement\n    int cur_x2 = 0, cur_y2 = 0;\n    int max_width2 = 0;\n    int total_height2 = 0;\n    \n    // Just use a simple row arrangement for now\n    vector<int> widths(n);\n    vector<int> heights2(n);\n    int total_w = 0;\n    int max_h2 = 0;\n    \n    for (int i = 0; i < n; ++i) {\n        int w = maxx[i] - minx[i] + 1;\n        int h = maxy[i] - miny[i] + 1;\n        widths[i] = w;\n        heights2[i] = h;\n        total_w += w;\n        max_h2 = max(max_h2, h);\n    }\n    \n    // Try placing them in a row, but optimize for area\n    int W = total_w;\n    int H = max_h2;\n    int area = W * H;\n    \n    // Try to fit them better\n    int best_area2 = area;\n    int best_W = W;\n    int best_H = H;\n    \n    vector<tuple<int,int,int,int>> final_placement(n);\n    \n    // Simple row placement\n    int cur_x3 = 0;\n    int max_h3 = 0;\n    for (int i = 0; i < n; ++i) {\n        int w = maxx[i] - minx[i] + 1;\n        int h = maxy[i] - miny[i] + 1;\n        max_h3 = max(max_h3, h);\n        final_placement[i] = {cur_x3 - minx[i], 0 - miny[i], 0, 0};\n        cur_x3 += w;\n    }\n    \n    int final_w = cur_x3;\n    int final_h = max_h3;\n    \n    cout << final_w << \" \" << final_h << \"\\n\";\n    for (int i = 0; i < n; ++i) {\n        cout << get<0>(final_placement[i]) << \" \" << get<1>(final_placement[i]) << \" \" << get<2>(final_placement[i]) << \" \" << get<3>(final_placement[i]) << \"\\n\";\n    }\n    \n    return 0;\n}"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.00)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(25.90)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(27.81)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
