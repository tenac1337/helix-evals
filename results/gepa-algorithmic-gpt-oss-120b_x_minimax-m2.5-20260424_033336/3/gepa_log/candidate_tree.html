<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.0, "parents": "seed", "role": "Seed", "components": {"current_candidate": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n\n    // Read all input so we don't deadlock on problems that pipe data.\n    string line;\n    while (getline(cin, line)) { /* discard */ }\n\n    // Trivial placeholder answer. GEPA's reflection LM should replace this\n    // with real logic based on the per-test-case scoring feedback.\n    cout << 0 << endl;\n\n    return 0;\n}\n"}},
{"idx": 1, "score": 6.6667, "parents": "0", "role": "Best", "components": {"current_candidate": "#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <numeric>\n\nusing namespace std;\n\n/**\n * Problem Analysis:\n * We need to find a circular permutation p1, p2, ..., pn.\n * We can flip the state of lamp holders. If the resulting set S contains \n * adjacent holders on the ring, the system returns 1, otherwise 0.\n * \n * Strategy:\n * 1. Identify which pairs are adjacent.\n * 2. For a fixed element (say 1), find its two neighbors.\n * 3. Once we have one neighbor, we can traverse the ring.\n * \n * To find if {u, v} are adjacent:\n * - Ensure S is empty.\n * - Flip u (S={u}), system returns 0.\n * - Flip v (S={u, v}), system returns 1 if adjacent, 0 otherwise.\n * - Flip v (S={u}), returns 0.\n * - Flip u (S={}), returns 0.\n * \n * However, n can be up to several hundreds (implied by competitive programming limits).\n * O(n^2) queries might be too many. But we have 10 seconds.\n * Let's optimize:\n * To find neighbors of u:\n * Iterate v from 1 to n (v != u).\n * Query: L=2, {u, v}. \n * But the state S persists.\n * \n * Correct Sequence to test if {u, v} is adjacent:\n * Current S is empty.\n * Query: 2 u v\n * Result: [res1, res2]\n * res1: is {u} adjacent? (Always 0)\n * res2: is {u, v} adjacent? (1 if adj, 0 otherwise)\n * To reset S to empty for next pair:\n * Query: 2 v u\n * Result: [res3, res4]\n * res3: is {u} adjacent? (0)\n * res4: is {} adjacent? (0)\n * \n * This takes 2 queries per pair. Still O(n^2).\n * Given the time limit of 10s and the nature of the problem, we can find the \n * adjacency list by checking all pairs or using a more efficient search.\n */\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n\n    int subtask, n;\n    if (!(cin >> subtask >> n)) return 0;\n\n    if (n == 2) {\n        cout << \"-1 1 2\" << endl;\n        return 0;\n    }\n\n    vector<vector<int>> adj(n + 1);\n    vector<int> neighbors_of_1;\n\n    // Find neighbors of 1\n    for (int v = 2; v <= n; ++v) {\n        cout << \"2 1 \" << v << endl;\n        int r1, r2;\n        cin >> r1 >> r2;\n        if (r2 == 1) {\n            neighbors_of_1.push_back(v);\n        }\n        // Reset S to empty\n        cout << \"2 \" << v << \" 1\" << endl;\n        int r3, r4;\n        cin >> r3 >> r4;\n        \n        if (neighbors_of_1.size() == 2) break;\n    }\n\n    // Now we have two neighbors of 1. Let's call them L and R.\n    // We can reconstruct the ring by finding the neighbor of R that isn't 1, and so on.\n    vector<int> p;\n    p.push_back(1);\n    p.push_back(neighbors_of_1[0]);\n\n    vector<bool> visited(n + 1, false);\n    visited[1] = true;\n    visited[neighbors_of_1[0]] = true;\n\n    while (p.size() < (size_t)n) {\n        int current = p.back();\n        bool found = false;\n        for (int v = 1; v <= n; ++v) {\n            if (visited[v]) continue;\n            \n            // Check if current and v are adjacent\n            cout << \"2 \" << current << \" \" << v << endl;\n            int r1, r2;\n            cin >> r1 >> r2;\n            \n            // Reset S\n            cout << \"2 \" << v << \" \" << current << endl;\n            int r3, r4;\n            cin >> r3 >> r4;\n\n            if (r2 == 1) {\n                p.push_back(v);\n                visited[v] = true;\n                found = true;\n                break;\n            }\n        }\n        if (!found) break; // Should not happen\n    }\n\n    cout << \"-1\";\n    for (int i = 0; i < n; ++i) {\n        cout << \" \" << p[i];\n    }\n    cout << endl;\n\n    return 0;\n}"}},
{"idx": 2, "score": 6.6667, "parents": "1", "role": "Pareto Front", "components": {"current_candidate": "#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <numeric>\n#include <cstring>\n\nusing namespace std;\n\n/**\n * Problem Analysis:\n * We need to find a circular permutation p1, p2, ..., pn.\n * We can flip the state of lamp holders. If the resulting set S contains \n * adjacent holders on the ring, the system returns 1, otherwise 0.\n * \n * Strategy:\n * 1. Find neighbors of element 1.\n * 2. Traverse the ring from both neighbors to reconstruct the full permutation.\n * \n * To test if {u, v} are adjacent:\n * - Query: L=2, {u, v}\n * - Result: [r1, r2] where r2=1 iff u and v are adjacent\n * - Reset: Query: L=2, {v, u} to empty S\n */\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n\n    int subtask, n;\n    if (!(cin >> subtask >> n)) return 0;\n\n    if (n == 2) {\n        cout << \"-1 1 2\" << endl;\n        return 0;\n    }\n\n    if (n == 1) {\n        cout << \"-1 1\" << endl;\n        return 0;\n    }\n\n    vector<int> neighbors_of_1;\n\n    // Find neighbors of 1\n    for (int v = 2; v <= n; ++v) {\n        // Query: flip 1, then flip v\n        cout << \"2 1 \" << v << endl;\n        cout.flush();\n        \n        int r1, r2;\n        cin >> r1 >> r2;\n        \n        if (r2 == 1) {\n            neighbors_of_1.push_back(v);\n        }\n        \n        // Reset S to empty by flipping v, then flipping 1\n        cout << \"2 \" << v << \" 1\" << endl;\n        cout.flush();\n        \n        int r3, r4;\n        cin >> r3 >> r4;\n        \n        if (neighbors_of_1.size() == 2) break;\n    }\n\n    // Ensure we found exactly 2 neighbors\n    if (neighbors_of_1.size() != 2) {\n        // This should not happen for valid input\n        // But handle gracefully by continuing with what we have\n    }\n\n    int left = neighbors_of_1[0];\n    int right = neighbors_of_1[1];\n\n    // Build permutation starting from 1\n    vector<int> p;\n    p.push_back(1);\n    \n    vector<bool> visited(n + 1, false);\n    visited[1] = true;\n\n    // Traverse in one direction (left)\n    int current = left;\n    while (current != 1) {\n        p.push_back(current);\n        visited[current] = true;\n        \n        // Find next neighbor of current that isn't the previous node\n        int prev = p[p.size() - 2];\n        \n        bool found = false;\n        for (int v = 1; v <= n; ++v) {\n            if (visited[v] || v == prev) continue;\n            \n            // Check if current and v are adjacent\n            cout << \"2 \" << current << \" \" << v << endl;\n            cout.flush();\n            \n            int r1, r2;\n            cin >> r1 >> r2;\n            \n            // Reset S\n            cout << \"2 \" << v << \" \" << current << endl;\n            cout.flush();\n            \n            int r3, r4;\n            cin >> r3 >> r4;\n            \n            if (r2 == 1) {\n                current = v;\n                found = true;\n                break;\n            }\n        }\n        if (!found) break;\n    }\n\n    // Traverse in the other direction (right)\n    current = right;\n    vector<int> rightBranch;\n    while (current != 1) {\n        rightBranch.push_back(current);\n        visited[current] = true;\n        \n        // Find next neighbor that isn't the previous node\n        int prev = (rightBranch.size() == 1) ? 1 : rightBranch[rightBranch.size() - 2];\n        \n        bool found = false;\n        for (int v = 1; v <= n; ++v) {\n            if (visited[v] || v == prev) continue;\n            \n            // Check if current and v are adjacent\n            cout << \"2 \" << current << \" \" << v << endl;\n            cout.flush();\n            \n            int r1, r2;\n            cin >> r1 >> r2;\n            \n            // Reset S\n            cout << \"2 \" << v << \" \" << current << endl;\n            cout.flush();\n            \n            int r3, r4;\n            cin >> r3 >> r4;\n            \n            if (r2 == 1) {\n                current = v;\n                found = true;\n                break;\n            }\n        }\n        if (!found) break;\n    }\n\n    // Append right branch in reverse (since we traversed from 1 outward)\n    for (int i = rightBranch.size() - 1; i >= 0; --i) {\n        p.push_back(rightBranch[i]);\n    }\n\n    // If we haven't found all elements, try alternative traversal\n    if (p.size() < (size_t)n) {\n        p.clear();\n        visited.assign(n + 1, false);\n        \n        // Start fresh: build from 1 in both directions\n        p.push_back(1);\n        visited[1] = true;\n        \n        // Go left\n        current = left;\n        while (true) {\n            p.push_back(current);\n            visited[current] = true;\n            \n            if (p.size() == n) break;\n            \n            int prev = p[p.size() - 2];\n            bool found = false;\n            \n            for (int v = 1; v <= n; ++v) {\n                if (visited[v] || v == prev) continue;\n                \n                cout << \"2 \" << current << \" \" << v << endl;\n                cout.flush();\n                int r1, r2;\n                cin >> r1 >> r2;\n                \n                cout << \"2 \" << v << \" \" << current << endl;\n                cout.flush();\n                int r3, r4;\n                cin >> r3 >> r4;\n                \n                if (r2 == 1) {\n                    current = v;\n                    found = true;\n                    break;\n                }\n            }\n            if (!found) break;\n        }\n        \n        // If not complete, try from right\n        if (p.size() < (size_t)n) {\n            p.clear();\n            visited.assign(n + 1, false);\n            p.push_back(1);\n            visited[1] = true;\n            \n            current = right;\n            while (true) {\n                p.push_back(current);\n                visited[current] = true;\n                \n                if (p.size() == n) break;\n                \n                int prev = p[p.size() - 2];\n                bool found = false;\n                \n                for (int v = 1; v <= n; ++v) {\n                    if (visited[v] || v == prev) continue;\n                    \n                    cout << \"2 \" << current << \" \" << v << endl;\n                    cout.flush();\n                    int r1, r2;\n                    cin >> r1 >> r2;\n                    \n                    cout << \"2 \" << v << \" \" << current << endl;\n                    cout.flush();\n                    int r3, r4;\n                    cin >> r3 >> r4;\n                    \n                    if (r2 == 1) {\n                        current = v;\n                        found = true;\n                        break;\n                    }\n                }\n                if (!found) break;\n            }\n        }\n    }\n\n    // Output the answer\n    cout << \"-1\";\n    for (int i = 0; i < n; ++i) {\n        cout << \" \" << p[i];\n    }\n    cout << endl;\n\n    return 0;\n}"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.00)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(6.67)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(6.67)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
