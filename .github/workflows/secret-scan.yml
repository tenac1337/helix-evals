name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch history without executing repository code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SCAN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A bare repository also handles historical gitlinks without .gitmodules.
          git init --bare "$RUNNER_TEMP/secret-scan.git"
          git -C "$RUNNER_TEMP/secret-scan.git" remote add origin "https://github.com/$REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git -C "$RUNNER_TEMP/secret-scan.git" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            fetch --no-recurse-submodules origin \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*' \
            "$SCAN_COMMIT:refs/scanner/event"
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete fetched history
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git "$RUNNER_TEMP/secret-scan.git" --log-opts="--all --full-history" --redact=100 --no-banner'
